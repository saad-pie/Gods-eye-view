name: Deploy God's Eye View to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone Repository Subfolder If Needed
        run: |
          if [ ! -f "package.json" ] && [ ! -d "gods-eye-view" ]; then
            git clone https://github.com/bilawalsidhu/gods-eye-view
          fi

      - name: Install dependencies
        run: |
          cd gods-eye-view
          npm install --legacy-peer-deps

      - name: Inject Cesium CDN Script & Build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          cd gods-eye-view
          
          echo "=== Writing .env.production ==="
          echo "VITE_CESIUM_ION_TOKEN=$VITE_CESIUM_ION_TOKEN" >> .env.production
          echo "VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY" >> .env.production

          echo "=== Injecting Cesium Global Scripts into index.html ==="
          sed -i 's|</head>|<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css"><script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script></head>|g' index.html

          echo "=== Building Production Bundle ==="
          npx vite build --base=/Gods-eye-view/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './gods-eye-view/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
