name: Run God's Eye View Dev Environment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

defaults:
  run:
    working-directory: ./

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Doctor check
        run: npm run doctor

      - name: Run Dev Server
        run: |
          npm run dev &
          sleep 10
          
