name: Run God's Eye View Dev Environment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Diagnostic Step: Prints files so you can verify paths if it fails again
      - name: Inspect Repository Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Finding package.json location ==="
          find . -name "package.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          TARGET_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          echo "Target application folder located at: $TARGET_DIR"
          cd $TARGET_DIR
          npm install

      - name: Run Doctor check
        run: |
          TARGET_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          cd $TARGET_DIR
          npm run doctor

      - name: Run Dev Server
        run: |
          TARGET_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          cd $TARGET_DIR
          npm run dev &
          sleep 15
          
