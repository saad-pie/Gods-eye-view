name: Run God's Eye View Dev Environment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Manually clone, step inside, and execute sequentially in one workspace session
      - name: Clone and Spin Up Environment
        run: |
          git clone https://github.com/bilawalsidhu/gods-eye-view
          cd gods-eye-view
          
          echo "=== Installing Dependencies ==="
          npm install
          
          echo "=== Running Doctor Environment Check ==="
          npm run doctor
          
          echo "=== Starting Dev Server ==="
          npm run dev &
          sleep 15
          
